<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ঢাকা মেট্রোরেল এমআরটি-৬ ভাড়া ও স্টেশন ক্যালকুলেটর উইজেট | KoyJabo Embed</title>
  <meta name="robots" content="index, follow">
  <style>
    :root {
      --bg: #090d16;
      --card: #121824;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --brand: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; min-height: 100vh; }
    .widget-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; flex: 1; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .metro-badge { background: rgba(5, 150, 105, 0.15); color: #34d399; border: 1px solid rgba(5, 150, 105, 0.3); font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
    .input-group { margin-bottom: 10px; }
    .label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; display: block; }
    .select-box { width: 100%; background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }
    .result-box { background: #064e3b; border: 1px solid #059669; border-radius: 10px; padding: 12px; margin: 10px 0; text-align: center; }
    .fare-amount { font-size: 26px; font-weight: 800; color: #6ee7b7; }
    .rapid-pass { font-size: 12px; color: #a7f3d0; margin-top: 4px; font-weight: 600; }
    .btn-action { display: block; text-align: center; background: linear-gradient(135deg, #059669, #047857); color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; transition: opacity 0.2s; margin-top: auto; }
    .btn-action:hover { opacity: 0.9; }
    .footer-attribution { margin-top: 10px; font-size: 10px; text-align: center; color: var(--muted); }
    .footer-attribution a { color: #34d399; text-decoration: none; font-weight: 600; }
    .footer-attribution a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="widget-card">
    <div class="header">
      <div class="title"><span>🚇</span> ঢাকা মেট্রোরেল (MRT-6) ক্যালকুলেটর</div>
      <div class="metro-badge">১৬ স্টেশন চালু</div>
    </div>

    <div class="input-group">
      <label class="label">যাত্রা শুরুর স্টেশন (From):</label>
      <select id="fromStation" class="select-box" onchange="calcFare()">
        <option value="0">উত্তরা উত্তর (Uttara North)</option>
        <option value="1">উত্তরা সেন্টার (Uttara Center)</option>
        <option value="2">উত্তরা দক্ষিণ (Uttara South)</option>
        <option value="3">পল্লবী (Pallabi)</option>
        <option value="4">মিরপুর ১১ (Mirpur 11)</option>
        <option value="5">মিরপুর ১০ (Mirpur 10)</option>
        <option value="6">কাজীপাড়া (Kazipara)</option>
        <option value="7">শেওড়াপাড়া (Shewrapara)</option>
        <option value="8">আগারগাঁও (Agargaon)</option>
        <option value="9">বিজয় সরণি (Bijoy Sarani)</option>
        <option value="10">ফার্মগেট (Farmgate)</option>
        <option value="11">কারওয়ান বাজার (Karwan Bazar)</option>
        <option value="12">শাহবাগ (Shahbagh)</option>
        <option value="13">ঢাকা বিশ্ববিদ্যালয় (Dhaka University)</option>
        <option value="14">বাংলাদেশ সচিবালয় (Bangladesh Secretariat)</option>
        <option value="15" selected>মতিঝিল (Motijheel)</option>
      </select>
    </div>

    <div class="input-group">
      <label class="label">গন্তব্য স্টেশন (To):</label>
      <select id="toStation" class="select-box" onchange="calcFare()">
        <option value="0">উত্তরা উত্তর (Uttara North)</option>
        <option value="1">উত্তরা সেন্টার (Uttara Center)</option>
        <option value="2">উত্তরা দক্ষিণ (Uttara South)</option>
        <option value="3">পল্লবী (Pallabi)</option>
        <option value="4">মিরপুর ১১ (Mirpur 11)</option>
        <option value="5">মিরপুর ১০ (Mirpur 10)</option>
        <option value="6">কাজীপাড়া (Kazipara)</option>
        <option value="7">শেওড়াপাড়া (Shewrapara)</option>
        <option value="8">আগারগাঁও (Agargaon)</option>
        <option value="9">বিজয় সরণি (Bijoy Sarani)</option>
        <option value="10" selected>ফার্মগেট (Farmgate)</option>
        <option value="11">কারওয়ান বাজার (Karwan Bazar)</option>
        <option value="12">শাহবাগ (Shahbagh)</option>
        <option value="13">ঢাকা বিশ্ববিদ্যালয় (Dhaka University)</option>
        <option value="14">বাংলাদেশ সচিবালয় (Bangladesh Secretariat)</option>
        <option value="15">মতিঝিল (Motijheel)</option>
      </select>
    </div>

    <div class="result-box">
      <div id="fareAmount" class="fare-amount">৳৩০</div>
      <div id="rapidPassText" class="rapid-pass">💳 র্যাপিড পাস / এমআরটি পাস দিয়ে: ৳২৭ (১০% ছাড়)</div>
      <div id="timeText" style="font-size: 11px; color: #d1fae5; margin-top: 4px;">⏱️ আনুমানিক সময়: ১২ মিনিট</div>
    </div>

    <a href="https://koyjabo.com/metro" target="_blank" rel="noopener" class="btn-action">
      🚇 সম্পূর্ণ মেট্রোরেল গাইড ও সময়সূচি দেখুন →
    </a>

    <div class="footer-attribution">
      তথ্যসূত্র: <a href="https://koyjabo.com/metro" target="_blank" rel="noopener">KoyJabo (কই যাবো) — মেট্রোরেল গাইড</a>
    </div>
  </div>

  <script>
    function calcFare() {
      const from = parseInt(document.getElementById('fromStation').value);
      const to = parseInt(document.getElementById('toStation').value);
      const diff = Math.abs(to - from);
      
      let fare = 20;
      if (diff === 0) fare = 0;
      else if (diff <= 2) fare = 20;
      else if (diff <= 4) fare = 30;
      else if (diff <= 6) fare = 40;
      else if (diff <= 8) fare = 50;
      else if (diff <= 10) fare = 60;
      else if (diff <= 12) fare = 70;
      else if (diff <= 14) fare = 80;
      else fare = 100;

      const rapid = Math.round(fare * 0.9);
      const time = diff * 2.2;

      document.getElementById('fareAmount').innerText = '৳' + fare;
      if (fare === 0) {
        document.getElementById('rapidPassText').innerText = 'একই স্টেশন নির্বাচন করা হয়েছে';
        document.getElementById('timeText').innerText = '⏱️ সময়: ০ মিনিট';
      } else {
        document.getElementById('rapidPassText').innerText = '💳 র্যাপিড পাস দিয়ে: ৳' + rapid + ' (১০% ছাড়)';
        document.getElementById('timeText').innerText = '⏱️ আনুমানিক সময়: ' + Math.round(time) + ' মিনিট';
      }
    }
    calcFare();
  </script>
</body>
</html>
